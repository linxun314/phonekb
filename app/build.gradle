plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonekb'
    compileSdk 36

    defaultConfig {
        applicationId 'com.phonekb'
        minSdk 28
        targetSdk 36
        versionCode 20
        versionName '0.15.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// zxing-core is bundled purely to render the pairing QR code in the companion page.
dependencies {
    implementation files('libs/zxing-core-3.5.3.jar')
}
