plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonekb'
    compileSdk 36

    defaultConfig {
        applicationId 'com.phonekb'
        minSdk 28
        targetSdk 36
        versionCode 58
        versionName '0.36.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

