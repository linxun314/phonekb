name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 运行器自带 Android SDK，不再用 android-actions/setup-android@v3
      # （该 action 在新版镜像上会因 sdkmanager 找不到 tools 包而失败）。
      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # 预装/联网安装；失败也不影响，Gradle 构建时会自动补装缺失组件
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.1.0" || true

      - name: Build with Gradle
        run: |
          chmod +x gradlew || true
          sh ./gradlew --no-daemon assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKB-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKB-Companion-debug-apk
          path: companion/build/outputs/apk/debug/companion-debug.apk
          if-no-files-found: error